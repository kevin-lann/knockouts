name: Deploy PartyKit

on:
  push:
    branches:
      - master
    paths:
      - "game/**"
      - "shared/**"
      - ".github/workflows/deploy-partykit.yml"
  workflow_dispatch:

concurrency:
  group: partykit-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN || vars.PARTYKIT_LOGIN }}
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN || vars.PARTYKIT_TOKEN }}
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate PartyKit auth env
        run: |
          if [ -z "$PARTYKIT_LOGIN" ] || [ -z "$PARTYKIT_TOKEN" ]; then
            echo "::error::Missing PARTYKIT_LOGIN or PARTYKIT_TOKEN. Set them as GitHub Secrets (recommended) or Repository Variables."
            exit 1
          fi

      - name: Deploy
        run: npx partykit deploy
