name: Deploy PartyKit

on:
  push:
    branches:
      - master
    paths:
      - "game/**"
      - "shared/**"
      - ".github/workflows/deploy-partykit.yml"
  workflow_dispatch:

concurrency:
  group: partykit-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN || vars.PARTYKIT_LOGIN }}
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN || vars.PARTYKIT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      JOIN_TOKEN_SECRET: ${{ secrets.JOIN_TOKEN_SECRET || vars.JOIN_TOKEN_SECRET }}
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate PartyKit auth env
        run: |
          if [ -z "$PARTYKIT_LOGIN" ] || [ -z "$PARTYKIT_TOKEN" ]; then
            echo "::error::Missing PARTYKIT_LOGIN or PARTYKIT_TOKEN. Set them as GitHub Secrets (recommended) or Repository Variables."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL. Set it in GitHub Secrets/Variables (or Environment Secrets) for this workflow environment."
            exit 1
          fi
          if [ -z "$JOIN_TOKEN_SECRET" ]; then
            echo "::error::Missing JOIN_TOKEN_SECRET. It must match the Vercel JOIN_TOKEN_SECRET value."
            exit 1
          fi

      - name: Prepare deploy env file
        run: |
          cat > .env.local <<EOF
          DATABASE_URL=$DATABASE_URL
          JOIN_TOKEN_SECRET=$JOIN_TOKEN_SECRET
          EOF

      - name: Deploy
        run: |
          npx partykit deploy \
            --name game-server \
            --with-env \
            --var "DATABASE_URL=$DATABASE_URL" \
            --var "JOIN_TOKEN_SECRET=$JOIN_TOKEN_SECRET"
